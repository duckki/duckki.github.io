title: "PL Rant"
description: "Essays about programming languages, ownership, and static analysis."
url: "https://duckki.github.io"
baseurl: ""
lang: "en"
timezone: "America/Los_Angeles"

author:
  name: "Duckki Oe"
  email: "duckki.dev@gmail.com"

email: "duckki.dev@gmail.com"
github_username: "duckki"
linkedin_username: "duckki"

twitter:
  username: "DuckkiOe"
  card: "summary_large_image"

social:
  name: "Duckki Oe"
  links:
    - "https://github.com/duckki"
    - "https://www.linkedin.com/in/duckki"

analytics:
  cloudflare_token: "0ef1f62ab3654784ac84d16e6c82dafc"

theme: "minima"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

header_pages:
  - archive.md
  - about.md

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/social-card.png"
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - .bundle
  - .github
  - .scratch
  - .vscode
  - cspell.json
  - Gemfile
  - Gemfile.lock
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README.md
  - vendor
