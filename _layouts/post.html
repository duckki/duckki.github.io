---
layout: default
---
<article class="post h-entry" itemscope itemtype="https://schema.org/BlogPosting">
  <header class="post-header">
    <p class="post-kicker">Essay</p>
    <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1>
    <div class="post-meta">
      <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
        {{ page.date | date: "%B %-d, %Y" }}
      </time>
      <span aria-hidden="true">·</span>
      <span itemprop="author" itemscope itemtype="https://schema.org/Person">
        <span class="p-author h-card" itemprop="name">{{ site.author.name | escape }}</span>
      </span>
      {%- if page.tags.size > 0 -%}
        <span aria-hidden="true">·</span>
        <span>{{ page.tags | join: " · " }}</span>
      {%- endif -%}
    </div>
  </header>

  <div class="post-content e-content" itemprop="articleBody">
    {{ content }}
  </div>

  {% include sharelinks.html %}
  {% include navlinks.html %}

  <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
</article>
