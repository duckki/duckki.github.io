<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 70 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Formalization-first development</title>
  <desc id="desc">A paper passes through human review into a Lean source containing a formal specification, implementation, whole-function theorem, and machine-checked proof. The verified Lean source fans out to checked Python, Rust, JavaScript, and other production targets.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </linearGradient>
    <linearGradient id="lean-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26313a"/>
      <stop offset="1" stop-color="#23262b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="blue-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feFlood flood-color="#569cd6" flood-opacity="0.22"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0v8l10-4z" fill="#9cdcfe"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0v8l10-4z" fill="#6a9955"/>
    </marker>
    <style>
      .title { fill: #cccccc; font: 600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lane { fill: #858585; font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 2px; }
      .label { fill: #cccccc; font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .lean-label { fill: #9cdcfe; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 3px; }
      .symbol { fill: #dcdcaa; font: 500 32px Georgia, "Times New Roman", serif; text-anchor: middle; }
      .target { fill: #d4d4d4; font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .flow { fill: none; stroke: #9cdcfe; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .inside { fill: none; stroke: #858585; stroke-width: 2; stroke-linecap: round; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #c586c0; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <rect y="70" width="1200" height="520" rx="22" fill="url(#background)"/>
  <path d="M0 500C180 450 252 560 430 506s300-70 480-12 235 26 290-4v100H0z" fill="#569cd6" opacity="0.035"/>

  <!-- Human intent: a paper with equations and requirements. -->
  <g filter="url(#soft-shadow)">
    <path d="M68 176h126l42 42v216H68z" fill="#292929" stroke="#858585" stroke-width="2"/>
    <path d="M194 176v42h42" fill="#343434" stroke="#858585" stroke-width="2"/>
    <path d="M91 247h116M91 345h116M91 374h82" stroke="#6b6b6b" stroke-width="5" stroke-linecap="round"/>
    <path d="M91 287c18-30 38 30 58 0s38 30 58 0" fill="none" stroke="#c586c0" stroke-width="4" stroke-linecap="round"/>
    <text x="111" y="329" fill="#dcdcaa" font-family="Georgia, serif" font-size="23">Σ aᵢTᵢ(x)</text>
    <rect x="91" y="397" width="12" height="12" rx="2" fill="none" stroke="#b5cea8" stroke-width="2"/>
    <path d="m94 402 4 4 9-11" fill="none" stroke="#b5cea8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M114 403h72" stroke="#6b6b6b" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="152" y="470" class="lane" text-anchor="middle">HUMAN INTENT</text>

  <!-- Review eye and transition into Lean. -->
  <path d="M257 305h91" class="flow"/>
  <g transform="translate(274 262)">
    <path d="M0 18C12 2 38 2 50 18 38 34 12 34 0 18z" fill="#292929" stroke="#c586c0" stroke-width="2"/>
    <circle cx="25" cy="18" r="8" fill="#c586c0"/>
    <circle cx="25" cy="18" r="3" fill="#1f1f1f"/>
  </g>
  <text x="299" y="252" class="lane" text-anchor="middle" fill="#c586c0">REVIEW</text>

  <!-- Lean is the reviewed source: spec + code converge on a theorem and proof. -->
  <g filter="url(#soft-shadow)">
    <rect x="360" y="110" width="474" height="424" rx="28" fill="url(#lean-panel)" stroke="#569cd6" stroke-width="2.5"/>
    <rect x="514" y="92" width="166" height="43" rx="21.5" fill="#1f1f1f" stroke="#569cd6" stroke-width="2"/>
    <text x="597" y="120" class="lean-label" text-anchor="middle">LEAN</text>
  </g>

  <g filter="url(#blue-glow)">
    <circle cx="474" cy="229" r="57" fill="#292929" stroke="#569cd6" stroke-width="2.5"/>
    <text x="474" y="240" class="symbol">Σ</text>
    <text x="474" y="310" class="label" text-anchor="middle">specification</text>

    <circle cx="720" cy="229" r="57" fill="#292929" stroke="#c586c0" stroke-width="2.5"/>
    <text x="720" y="240" class="symbol">λ</text>
    <text x="720" y="310" class="label" text-anchor="middle">implementation</text>
  </g>

  <path d="M510 274c18 32 39 42 59 48" class="inside"/>
  <path d="M684 274c-18 32-39 42-59 48" class="inside"/>

  <g>
    <path d="M597 316l66 38-66 38-66-38z" fill="#292929" stroke="#569cd6" stroke-width="2.5"/>
    <text x="597" y="364" class="symbol">∀</text>
    <text x="618" y="420" class="label">whole-function theorem</text>
    <path d="M597 394v42" class="inside"/>
  </g>

  <g transform="translate(562 435)">
    <path d="M35 0c16 11 35 13 35 13v22c0 26-16 42-35 51C16 77 0 61 0 35V13S19 11 35 0z" fill="#263027" stroke="#6a9955" stroke-width="3"/>
    <path d="m18 40 10 10 22-25" fill="none" stroke="#b5cea8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- One verified source fans out into ordinary production targets. -->
  <path d="M834 322h70" class="flow"/>
  <circle cx="917" cy="322" r="11" fill="#c586c0"/>
  <path d="M917 322C946 322 943 191 977 191M917 322h60M917 322c29 0 26 131 60 131" class="branch"/>

  <text x="1058" y="125" class="lane" text-anchor="middle">PRODUCTION TARGETS</text>
  <g filter="url(#soft-shadow)">
    <circle cx="1058" cy="191" r="55" fill="#292929" stroke="#c586c0" stroke-width="2.5"/>
    <text x="1058" y="198" class="target">Py</text>
    <circle cx="1058" cy="322" r="55" fill="#292929" stroke="#c586c0" stroke-width="2.5"/>
    <text x="1058" y="329" class="target">Rust</text>
    <circle cx="1058" cy="453" r="55" fill="#292929" stroke="#c586c0" stroke-width="2.5"/>
    <text x="1058" y="460" class="target">JS ···</text>
  </g>

  <!-- Target checks visually return to the verified source. -->
  <path d="M1003 507c-83 69-206 80-309 30" fill="none" stroke="#6a9955" stroke-width="2.5" stroke-dasharray="7 8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <g transform="translate(861 542)">
    <circle cx="15" cy="15" r="14" fill="#263027" stroke="#6a9955" stroke-width="2"/>
    <path d="m8 15 5 5 10-12" fill="none" stroke="#b5cea8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
