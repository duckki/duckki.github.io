<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Comparing object types individually versus comparing type-condition regions</title>
  <desc id="desc">The left screen is divided into a grid and checks every object-type case. The right screen has the same overlapping type conditions but checks only the four bounded regions they form.</desc>
  <defs>
    <clipPath id="left-screen">
      <rect x="70" y="130" width="430" height="300" rx="12"/>
    </clipPath>
    <clipPath id="right-screen">
      <rect x="700" y="130" width="430" height="300" rx="12"/>
    </clipPath>
    <pattern id="pixel-grid" width="43" height="37.5" patternUnits="userSpaceOnUse">
      <path d="M43 0H0V37.5" fill="none" stroke="#777777" stroke-opacity="0.42" stroke-width="1"/>
      <circle cx="21.5" cy="18.75" r="2.7" fill="#cccccc" fill-opacity="0.78"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="24" fill="#1f1f1f"/>

  <text x="285" y="58" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="650" text-anchor="middle">Object-by-object search</text>
  <text x="915" y="58" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="650" text-anchor="middle">Type-condition regions</text>
  <text x="285" y="92" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Check every concrete type case</text>
  <text x="915" y="92" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" text-anchor="middle">Check once per bounded region</text>

  <g filter="url(#soft-shadow)">
    <rect x="70" y="130" width="430" height="300" rx="12" fill="#252526" stroke="#555555" stroke-width="2"/>
    <g clip-path="url(#left-screen)">
      <ellipse cx="240" cy="280" rx="145" ry="112" fill="#4daafc" fill-opacity="0.24" stroke="#4daafc" stroke-width="4"/>
      <ellipse cx="340" cy="280" rx="122" ry="155" fill="#c586c0" fill-opacity="0.23" stroke="#c586c0" stroke-width="4"/>
      <rect x="70" y="130" width="430" height="300" fill="url(#pixel-grid)"/>
    </g>
  </g>

  <text x="155" y="171" fill="#75beff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">Type condition A</text>
  <text x="352" y="171" fill="#d19ad0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">Type condition B</text>
  <text x="285" y="469" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650" text-anchor="middle">80 type cases → 80 comparisons</text>
  <text x="285" y="500" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">Like testing every pixel on the screen</text>

  <g aria-hidden="true">
    <path d="M548 265H640" stroke="#777777" stroke-width="3" stroke-linecap="round"/>
    <path d="m626 251 14 14-14 14" fill="none" stroke="#777777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="594" y="237" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">partition by</text>
    <text x="594" y="303" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">boundaries</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="700" y="130" width="430" height="300" rx="12" fill="#252526" stroke="#555555" stroke-width="2"/>
    <g clip-path="url(#right-screen)">
      <ellipse cx="870" cy="280" rx="145" ry="112" fill="#4daafc" fill-opacity="0.24" stroke="#4daafc" stroke-width="4"/>
      <ellipse cx="970" cy="280" rx="122" ry="155" fill="#c586c0" fill-opacity="0.23" stroke="#c586c0" stroke-width="4"/>
    </g>
  </g>

  <text x="785" y="171" fill="#75beff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">Type condition A</text>
  <text x="982" y="171" fill="#d19ad0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="650">Type condition B</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <g transform="translate(746 365)">
      <circle r="21" fill="#333337" stroke="#888888" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">1</text>
    </g>
    <g transform="translate(827 283)">
      <circle r="21" fill="#17364d" stroke="#4daafc" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">2</text>
    </g>
    <g transform="translate(919 283)">
      <circle r="21" fill="#443044" stroke="#b27cb0" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">3</text>
    </g>
    <g transform="translate(1049 325)">
      <circle r="21" fill="#492d48" stroke="#c586c0" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">4</text>
    </g>
  </g>

  <text x="915" y="469" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650" text-anchor="middle">4 regions → 4 comparisons</text>
  <text x="915" y="500" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">All types in a region activate the same selections</text>

  <text x="600" y="540" fill="#4ec9b0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Fewer recursive sub-selection-set comparisons</text>
</svg>
