<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1040" viewBox="0 0 600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Comparing object types individually versus comparing type-condition regions</title>
  <desc id="desc">The upper screen checks every object-type case. The lower screen has the same overlapping type conditions but checks only the four bounded regions they form.</desc>
  <defs>
    <clipPath id="top-screen">
      <rect x="40" y="105" width="520" height="280" rx="12"/>
    </clipPath>
    <clipPath id="bottom-screen">
      <rect x="40" y="630" width="520" height="280" rx="12"/>
    </clipPath>
    <pattern id="pixel-grid" width="52" height="35" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V35" fill="none" stroke="#777777" stroke-opacity="0.42" stroke-width="1"/>
      <circle cx="26" cy="17.5" r="3" fill="#cccccc" fill-opacity="0.78"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="600" height="1040" rx="24" fill="#1f1f1f"/>

  <text x="300" y="45" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="650" text-anchor="middle">Object-by-object search</text>
  <text x="300" y="79" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" text-anchor="middle">Check every concrete type case</text>

  <g filter="url(#soft-shadow)">
    <rect x="40" y="105" width="520" height="280" rx="12" fill="#252526" stroke="#555555" stroke-width="2"/>
    <g clip-path="url(#top-screen)">
      <ellipse cx="245" cy="245" rx="168" ry="106" fill="#4daafc" fill-opacity="0.24" stroke="#4daafc" stroke-width="4"/>
      <ellipse cx="365" cy="245" rx="142" ry="145" fill="#c586c0" fill-opacity="0.23" stroke="#c586c0" stroke-width="4"/>
      <rect x="40" y="105" width="520" height="280" fill="url(#pixel-grid)"/>
    </g>
  </g>

  <text x="134" y="145" fill="#75beff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Type condition A</text>
  <text x="390" y="145" fill="#d19ad0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Type condition B</text>
  <text x="300" y="427" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650" text-anchor="middle">80 type cases → 80 comparisons</text>
  <text x="300" y="459" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">Like testing every pixel on the screen</text>

  <g aria-hidden="true">
    <text x="300" y="503" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">partition by boundaries</text>
    <path d="M300 516V551" stroke="#777777" stroke-width="3" stroke-linecap="round"/>
    <path d="m287 539 13 13 13-13" fill="none" stroke="#777777" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="300" y="585" fill="#d4d4d4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="650" text-anchor="middle">Type-condition regions</text>
  <text x="300" y="617" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" text-anchor="middle">Check once per bounded region</text>

  <g filter="url(#soft-shadow)">
    <rect x="40" y="630" width="520" height="280" rx="12" fill="#252526" stroke="#555555" stroke-width="2"/>
    <g clip-path="url(#bottom-screen)">
      <ellipse cx="245" cy="770" rx="168" ry="106" fill="#4daafc" fill-opacity="0.24" stroke="#4daafc" stroke-width="4"/>
      <ellipse cx="365" cy="770" rx="142" ry="145" fill="#c586c0" fill-opacity="0.23" stroke="#c586c0" stroke-width="4"/>
    </g>
  </g>

  <text x="134" y="670" fill="#75beff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Type condition A</text>
  <text x="390" y="670" fill="#d19ad0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650">Type condition B</text>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    <g transform="translate(93 846)">
      <circle r="22" fill="#333337" stroke="#888888" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">1</text>
    </g>
    <g transform="translate(196 772)">
      <circle r="22" fill="#17364d" stroke="#4daafc" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">2</text>
    </g>
    <g transform="translate(309 772)">
      <circle r="22" fill="#443044" stroke="#b27cb0" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">3</text>
    </g>
    <g transform="translate(469 820)">
      <circle r="22" fill="#492d48" stroke="#c586c0" stroke-width="2"/>
      <text y="6" fill="#d4d4d4">4</text>
    </g>
  </g>

  <text x="300" y="950" fill="#cccccc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="650" text-anchor="middle">4 regions → 4 comparisons</text>
  <text x="300" y="981" fill="#9d9d9d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" text-anchor="middle">All types in a region activate the same selections</text>
  <text x="300" y="1023" fill="#4ec9b0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="650" text-anchor="middle">Fewer recursive sub-selection-set comparisons</text>
</svg>
