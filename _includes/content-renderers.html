<script>
  (() => {
    const content = document.querySelector(".post-content, .page-content");
    if (!content) return;

    const textNodes = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        if (node.parentElement.closest("code, pre, script, style")) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      },
    });
    const inlineMath = /(^|[^\\$])\$(?![\s$])[^$\n]*?\S\$(?!\$)/;
    let hasMath = false;

    while (textNodes.nextNode()) {
      const text = textNodes.currentNode.nodeValue;
      if (text.includes("\\[") || text.includes("\\(") || inlineMath.test(text)) {
        hasMath = true;
        break;
      }
    }

    if (!hasMath) return;

    window.MathJax = {
      tex: {
        inlineMath: { "[+]": [["$", "$"]] },
      },
    };

    const script = document.createElement("script");
    script.defer = true;
    script.src = "https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js";
    document.head.appendChild(script);
  })();
</script>

<script type="module">
  const codeBlocks = [...document.querySelectorAll("pre > code.language-mermaid")];

  if (codeBlocks.length > 0) {
    try {
      const { default: mermaid } = await import(
        "https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.esm.min.mjs"
      );
      const diagrams = codeBlocks.map((code) => {
        const diagram = document.createElement("pre");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent;
        code.parentElement.replaceWith(diagram);
        return diagram;
      });

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "dark",
        themeVariables: {
          background: "#1f1f1f",
          primaryColor: "#292929",
          primaryTextColor: "#cccccc",
          primaryBorderColor: "#3c3c3c",
          lineColor: "#9d9d9d",
          secondaryColor: "#264778",
          tertiaryColor: "#181818",
        },
      });
      await mermaid.run({ nodes: diagrams });
    } catch (error) {
      console.warn("Unable to render Mermaid diagram; showing its source instead.", error);
    }
  }
</script>
