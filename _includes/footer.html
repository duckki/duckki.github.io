<footer class="site-footer">
  <div class="wrapper site-footer__inner">
    <div>
      <a class="site-footer__title" href="{{ '/' | relative_url }}">PL Rant</a>
      <p>{{ site.description | escape }}</p>
    </div>

    <nav class="site-footer__links" aria-label="Footer navigation">
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="mailto:{{ site.email }}">Email</a>
    </nav>

    <p class="site-footer__credit">© {{ site.time | date: '%Y' }} {{ site.author.name | escape }}</p>
  </div>
</footer>
{% include analytics.html %}
